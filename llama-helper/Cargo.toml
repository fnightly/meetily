[package]
name = "llama-helper"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
llama-cpp-2 = "=0.1.146"
encoding_rs = "0.8"

[features]
default = []
metal = ["llama-cpp-2/metal"]
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]

# NOTE: `[profile]` sections are ignored in member manifests -- Cargo only honours
# the one in the workspace root, and warns about the rest. The intended
# size-optimised release settings now live in the root manifest, and this
# workspace does not add its own `[profile.release]`, so `cargo build --release`
# stays the default for the app.
