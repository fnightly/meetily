[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "llama-helper"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.77"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }

# NOTE: `[patch]` sections are ignored in member manifests -- Cargo only honours
# the one in the workspace root. The identical section previously lived in
# `frontend/src-tauri/Cargo.toml`, so `cpal` silently resolved to the crates.io
# release and the WASAPI loopback support it was meant to add never applied,
# leaving Windows system-audio capture non-functional.
[patch.crates-io]
cpal = { git = "https://github.com/RustAudio/cpal", rev = "51c3b43" }
